name: Release FHT Acesso

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'   # ex.: v1.2.3

jobs:
  release:
    name: Build, Pack & Release
    runs-on: windows-latest

    permissions:
      contents: write   # necessário para criar GitHub Release e fazer upload de assets

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: ver
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install vpk (Velopack CLI)
        run: dotnet tool install -g vpk

      - name: Restore
        run: dotnet restore src/FHT.Access.App/FHT.Access.App.csproj

      - name: Publish (self-contained win-x64)
        shell: pwsh
        run: |
          dotnet publish src/FHT.Access.App/FHT.Access.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Version=${{ steps.ver.outputs.VERSION }} `
            -o publish/win-x64

      - name: Pack with Velopack
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force publish/velopack | Out-Null
          Set-Content -Path publish/velopack/RELEASE_NOTES.md -Value "FHT Acesso v${{ steps.ver.outputs.VERSION }}" -Encoding UTF8
          vpk pack `
            --packId "FHT.Acesso" `
            --packTitle "FHT Acesso" `
            --packVersion ${{ steps.ver.outputs.VERSION }} `
            --packDir publish/win-x64 `
            --mainExe "FHT.Access.App.exe" `
            --outputDir publish/velopack `
            --releaseNotes publish/velopack/RELEASE_NOTES.md `
            --icon src/FHT.Access.App/Assets/app.ico `
            --splashImage src/FHT.Access.App/Assets/installer-splash.png `
            --splashProgressColor "None"

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: FHT Acesso ${{ github.ref_name }}
          generate_release_notes: true
          files: publish/velopack/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
